name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # A real gateway in sandbox mode. No provider keys, nothing spent: the sandbox key answers
      # from the gateway's outcome table and never reaches a provider.
      gateway:
        image: ghcr.io/proxlane/gateway:0.22.0@sha256:938d0a31337f7efa1df51b2aa17868f78e47203c190ba06718ecfb25e05c6bc1
        ports: ["8787:8787"]
        env:
          # Per run, never a literal. The gateway refuses to start with a live key that has been
          # published, and a literal in a public workflow is published; the old fixed value is on
          # its refusal list. Unique per run and attempt, and it lives only on this runner.
          PROXLANE_API_KEY: ci-live-${{ github.run_id }}-${{ github.run_attempt }}-throwaway
          PROXLANE_SANDBOX_KEY: ci-sandbox-${{ github.run_id }}-${{ github.run_attempt }}-throwaway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: wait for the gateway
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/health && exit 0
            sleep 2
          done
          echo "gateway never became healthy"; exit 1
      - run: uv run pytest -q
        env:
          PROXLANE_TEST_URL: http://localhost:8787
          PROXLANE_TEST_SANDBOX_KEY: ci-sandbox-${{ github.run_id }}-${{ github.run_attempt }}-throwaway
